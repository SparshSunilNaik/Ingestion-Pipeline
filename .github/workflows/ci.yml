name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      UV_LINK_MODE: copy
      IP_OPENCODE_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run python -m ruff check .
      - name: Ruff format check
        run: uv run python -m ruff format --check .
      - name: Mypy
        run: uv run python -m mypy
      - name: Pytest (offline; live tests are skipped)
        run: uv run python -m pytest tests -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pip-audit (backend environment)
        working-directory: backend
        run: |
          uv sync --python 3.12
          uv run python -m pip_audit --skip-editable
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
